[build]
  # Pull fresh stats from Codolio first; if that fails, the saved cp.json is used and the build carries on.
  command = "node update-cp.mjs --soft && node build.mjs"
  publish = "dist"
  # Skip the deploy (exit 0 = skip) when a push only touches files that don't change the site,
  # like the README, CLAUDE.md or GitHub workflows. Skipped builds don't use Netlify credits.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)README.md' ':(exclude)CLAUDE.md' ':(exclude).github' ':(exclude).gitignore'"

[build.environment]
  NODE_VERSION = "22"
